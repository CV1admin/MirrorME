name: Deploy MirrorME to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      # The autogenerated `github-pages` environment has a broken custom branch
      # policy named `None`. This temporary environment remains limited to main
      # by the job condition above.
      name: pages-production
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Ensure workflow-based GitHub Pages is enabled
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pages_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          status="$({
            curl --silent --show-error \
              --output pages-response.json \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${pages_url}"
          })"

          if [[ "${status}" == "200" ]]; then
            echo 'GitHub Pages is already enabled.'
            exit 0
          fi

          if [[ "${status}" != "404" ]]; then
            cat pages-response.json
            echo "Unexpected Pages status: ${status}" >&2
            exit 1
          fi

          create_status="$({
            curl --silent --show-error \
              --request POST \
              --output pages-create-response.json \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/json' \
              --data '{"build_type":"workflow"}' \
              "${pages_url}"
          })"

          if [[ "${create_status}" != "201" && "${create_status}" != "204" && "${create_status}" != "409" ]]; then
            cat pages-create-response.json
            echo "Unable to enable GitHub Pages: HTTP ${create_status}" >&2
            exit 1
          fi

          echo 'Workflow-based GitHub Pages is enabled.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
