mkultra:
  version: 0.4.0
  codename: Governed Thin Line

  inheritance:
    runtime: mkultra-v0.3
    transactional_ingestion: true
    anchored_hash_integrity: true
    exact_boolean_validation: true

  thin_line_claims:
    enabled: true
    append_only_hash_chain: true
    require_source_hash: true
    layers:
      - MATHEMATICAL_DEFINITION
      - COMPUTATIONAL_ANALOGY
      - COGNITIVE_HYPOTHESIS
      - PHYSICAL_HYPOTHESIS
      - EMPIRICAL_EVIDENCE
      - MYTHOLOGY_STORY
    mythology_can_support_engineering_alone: false
    physical_claims_require_falsification_criterion: true

  governed_evolution:
    enabled: true
    review_threshold: 0.75
    human_review_required: true
    proposal_chain: append_only_hash_linked
    output: inspectable_change_packet
    allowed_next_step: human-reviewed branch or pull request
    automatic_execution: false
    direct_code_execution: false
    direct_weight_update: false
    direct_policy_update: false
    direct_identity_update: false

  local_bridge:
    enabled: true
    host: 127.0.0.1
    port: 8765
    verified_local_session_required_for_mutation: true
    read_only_routes:
      - /api/v04/status
      - /api/v04/claims
    governed_routes:
      - /api/v04/evolution/propose
      - /api/v04/evolution/evaluate
      - /api/v04/evolution/approve

  ui:
    route: /mkultra-v04
    default_endpoint: http://localhost:8765
    display_execution_authorized: false
    display_epistemic_layers: true

  routing:
    local_first: true
    default_provider: ollama
    default_model: mkultra:0.4
    cloud_fallback: false

  safety:
    sentience_claim: false
    automatic_persistence: false
    external_actions: false
    source_content_is_model_truth: false
    human_approval_required: true
    provenance_required: true
